name: FireRed3DS platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Source publication audit
        run: |
          python tools/release_audit.py --repo . --strict
          python tools/check_firered_public_source.py --refs HEAD
      - name: FireRed bridge and inherited input/video contracts
        run: make -C firered_port check
      - name: Builder remains an Emerald reference
        run: python -m unittest discover -s builder/tests -v
  sdk:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile source-only diagnostic
        run: make -C firered_port port-check
      - name: Require diagnostic3DSX header
        run: python3 -c "from pathlib import Path; p=Path('firered_port/build/FireRedEvolved3DS-port-check.3dsx'); assert p.read_bytes()[:4]==b'3DSX'"
      # No game checkout, game assets, publication or uploaded binaries.
